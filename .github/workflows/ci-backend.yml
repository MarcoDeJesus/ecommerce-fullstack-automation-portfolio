name: CI Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: b2b-ecommerce-platform

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: b2b-ecommerce-platform/backend/pom.xml

      - name: Build and run unit tests
        run: mvn -f backend -B verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: b2b-ecommerce-platform/backend/target/ecommerce-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
