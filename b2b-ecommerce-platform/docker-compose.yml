services:
  postgres:
    image: postgres:16-alpine
    container_name: b2b-postgres
    environment:
      POSTGRES_DB: b2b_ecommerce
      POSTGRES_USER: b2b_user
      POSTGRES_PASSWORD: b2b_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b2b_user -d b2b_ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: b2b-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: b2b_ecommerce
      DB_USER: b2b_user
      DB_PASSWORD: b2b_pass
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: b2b-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
